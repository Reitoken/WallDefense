; --- PlayStation controllers via the RawInput plugin (Windows has no native DualShock/DualSense support) ---
; Every HID axis/button is mapped onto the STANDARD Gamepad_* keys, so all Enhanced Input
; bindings work unchanged. DS4/DualSense HID layout: axes X,Y = left stick; Z = right X;
; Rx = L2; Ry = R2; Rz = right Y. Buttons: Square, Cross, Circle, Triangle, L1, R1, L2, R2,
; Share/Create, Options, L3, R3 (PS/touchpad left unmapped). Known limits: no rumble over
; RawInput, and the D-pad (HID hat switch) is not exposed — the game does not use it.
[/Script/RawInput.RawInputSettings]
